<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corbeau Catalog</title>
  <meta name="description" content="Corbeau digital product catalog">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Corbeau Catalog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="assets/styles.css?v=20261019d">
  <!-- StPageFlip 2.0.7 (MIT) and qrcode-generator 1.4.4 (MIT), pinned with integrity hashes -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"
          integrity="sha384-cyIiCZ+fqkDRUItBWrieJOpBC8HFlPyZIqOA/Bd7TU5ypCjLgHm1ty8jJMw/UkaH" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
          integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
  <script src="assets/app.js?v=20261019d" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo" role="img" aria-label="Corbeau"></span>
      <span class="catalog-name" id="catalog-name"></span>
    </div>
    <div class="tools">
      <button class="tool" id="btn-contents" title="The lineup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg>
        <span class="label">Lineup</span>
      </button>
      <button class="tool not-booth" id="btn-share" title="QR code for this catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        <span class="label">QR</span>
      </button>
      <button class="tool not-booth" id="btn-fullscreen" title="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="tool not-booth" id="btn-booth" title="Booth mode for an iPad at a table">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <span class="label">Booth mode</span>
      </button>
      <span class="booth-tag booth-only" title="Returns to the start screen after 90 seconds untouched">Booth mode</span>
      <button class="tool booth-only hold" id="btn-exit-booth" title="Press and hold to leave booth mode">
        <span class="fill"></span><span class="label">Hold to exit</span>
      </button>
      <button class="tool bag-btn" id="btn-bag" title="Your bag" aria-label="Your bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
        <span class="count" id="bag-count" hidden>0</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <div id="book" aria-label="Catalog"></div>
    <div id="spread-media" hidden>
      <video id="film" playsinline preload="none" controls controlslist="nodownload noplaybackrate" disablepictureinpicture></video>
      <div class="film-caption" id="film-caption"></div>
      <button class="sound-pill" id="btn-sound" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        Tap for sound
      </button>
    </div>
    <button class="side-nav prev" id="btn-prev" aria-label="Previous page"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M18 4L6 24l12 20"/></svg></button>
    <button class="side-nav next" id="btn-next" aria-label="Next page"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 4l12 20L6 44"/></svg></button>
  </main>

  <nav class="pager" aria-label="Pages">
    <div class="page-status" id="page-status" aria-live="polite"></div>
    <div class="track" id="track" title="Jump to a page"><div class="track-fill" id="track-fill"></div></div>
  </nav>

  <aside class="drawer" id="bag" hidden aria-label="Your bag">
    <div class="drawer-card">
      <header><h3>Your bag</h3><button class="icon-btn" data-bag="close" aria-label="Close">&times;</button></header>
      <div class="bag-lines" id="bag-lines"></div>
      <footer id="bag-foot"></footer>
    </div>
  </aside>

  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lb-close" data-lb="close" aria-label="Close">&times;</button>
    <button class="lb-nav prev" data-lb="prev" aria-label="Previous photo"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M18 4L6 24l12 20"/></svg></button>
    <figure class="lb-figure" id="lb-figure"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-nav next" data-lb="next" aria-label="Next photo"><svg viewBox="0 0 24 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 4l12 20L6 44"/></svg></button>
    <div class="lb-thumbs" id="lb-thumbs"></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="start-overlay" id="start-overlay" hidden>
    <div><span class="logo"></span><span class="go">Tap to explore</span></div>
  </div>
  <div class="toast" id="toast" hidden><span id="toast-text"></span><button id="toast-action" hidden></button></div>
  <div class="loading" id="loading">Loading catalog...</div>
</body>
</html>
